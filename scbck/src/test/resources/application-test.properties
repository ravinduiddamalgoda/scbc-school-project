# In-memory database for the API tests, so they run without a MySQL instance.
#
# MODE=MySQL keeps the SQL dialect close to production. NON_KEYWORDS=USER is
# needed because the application maps an entity to a table literally named
# "user", which H2 otherwise treats as a reserved word.
spring.datasource.url=jdbc:h2:mem:scbc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

scbc.admin.initial-password=BootstrapPass1
scbc.cors.allowed-origins=http://localhost:5173

logging.level.org.hibernate.SQL=warn
